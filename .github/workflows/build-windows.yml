name: Build BillTrix for Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build installer (updates are served by the BillTrix server, not GitHub)
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: BillTrix-Setup
          path: |
            dist/*.exe
            dist/latest.yml
